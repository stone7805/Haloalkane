 if(!readonly){$('answerForm').addEventListener('change',function(e){capture(t,index,practice);clearFieldError(e.target)});$('answerForm').addEventListener('input',function(e){if(e.target.id==='formula'){capture(t,index,practice);clearFieldError(e.target)}});if(t.kind==='lab')$('run').onclick=function(){capture(t,index,practice);var d=currentDraft(index,practice);if(!d.answers.protocol){$('runResult').textContent='先选择处理方式。';return}d.run=sim(t,d.answers.protocol);$('runResult').textContent=d.run.log;if(!practice)save()};$('answerForm').onsubmit=function(e){e.preventDefault();capture(t,index,practice);submit(index,practice)}}}
function capture(t,index,practice){var d=currentDraft(index,practice),form=$('answerForm'),a={};if(t.kind==='formula')a.formula=$('formula').value.slice(0,80);else if(t.kind==='multi'){a.ids=Array.from(form.querySelectorAll('input[name="ids"]:checked')).map(function(x){return x.value});var reason=form.querySelector('input[name="reason"]:checked');a.reason=reason?reason.value:''}else if(t.kind==='sequence'){for(var k=0;k<3;k++)a['step'+k]=$('step'+k).value}else{if(t.kind==='lab')a.protocol=$('protocol').value;(t.fields||[]).forEach(function(f){var chosen=form.querySelector('input[name="'+f.key+'"]:checked');a[f.key]=chosen?chosen.value:''})}if(t.kind==='lab'&&d.answers.protocol!==a.protocol){d.run=null;$('runResult').textContent='处理方式已改变，请重新运行模拟。'}d.answers=a;if(!practice)save()}
function clearFieldError(input){var field=input.closest('.field');if(field)field.classList.remove('error')}
function markErrors(keys){keys.forEach(function(key){var el=$('answerForm').querySelector('[data-field="'+key+'"]');if(el)el.classList.add('error')})}
function submit(index,practice){if(conflict||!state.identity||!state.identity.locked||state.endedAt!==null&&practice)return;var t=TASKS[index],r=state.records[index];if(practice){if(state.view!=='practice'||practiceIndex!==index||!r.passedAt||r.wrong===0||r.practicedAt!==null)return}else{if(state.view!=='task'||index!==firstOpen(state)||r.passedAt!==null)return}var d=currentDraft(index,practice),result=evaluate(t,d.answers,d.run),feedback=$('feedback');if(result.missing.length){feedback.className='feedback bad';feedback.textContent='请先完成：'+result.missing.map(function(k){return k==='run'?'运行模拟':k==='ids'?'勾选结构':k==='formula'?'结构简式':k==='reason'?'排重依据':k.indexOf('step')===0?'第'+(Number(k.slice(4))+1)+'步':k==='protocol'?'处理方式':(t.fields||[]).find(function(f){return f.key===k}).label}).join('、')+'。未计尝试。';markErrors(result.missing);return}
 if(practice){r.practiceAttempts++;if(result.errors.length){feedback.className='feedback bad';feedback.textContent=result.explain||'再核对一遍证据。';markErrors(result.errors);save();return}r.practicedAt=Date.now();r.practiceSnapshot={answers:copyAnswers(d.answers),run:d.run?{protocol:d.run.protocol,ok:d.run.ok,log:d.run.log}:null};var button=$('submit');if(button)button.disabled=true;Array.from($('answerForm').elements).forEach(function(x){x.disabled=true});feedback.className='feedback good';feedback.textContent='重练已掌握：'+t.output;var final=finish();save();reward(final,0);practiceIndex=null;practiceDraft=null;state.view=final?'report':pending(state).length?'practice':'mistakes';save();render();return}
 r.attempts++;if(result.errors.length){r.wrong++;feedback.className='feedback bad';feedback.textContent=result.explain||'证据与结论还不一致，请核对标出的字段。';markErrors(result.errors);save();renderNav();return}r.passedAt=Date.now();r.score=scoreFor(t.points,r.attempts);r.snapshot={answers:copyAnswers(d.answers),run:d.run?{protocol:d.run.protocol,ok:d.run.ok,log:d.run.log}:null};var final=finish();save();reward(final,r.score);if(allFormal(state)&&!final)announce('正式四关已完成，还有 '+pending(state).length+' 项错题需要重练。');state.cursor=firstOpen(state);state.view=final?'report':allFormal(state)?'mistakes':'task';save();render()}
function copyAnswers(a){var o={};Object.keys(a).forEach(function(k){o[k]=Array.isArray(a[k])?a[k].slice():a[k]});return o}
function finish(){if(complete(state)&&state.endedAt===null){settle();activeAt=null;state.endedAt=Date.now();clockRun();return true}return false}
function renderMistakes(){var el=$('content'),list=state.records.map(function(r,i){return {r:r,i:i}}).filter(function(x){return x.r.wrong>0});el.innerHTML='<div class="eyebrow">必修巩固</div><h2>错题档案</h2><p class="muted">任务先正式通过，再独立重练。练对后才可从待练清单移出，打印报告需全部待练完成。</p><div id="mistakeList"></div><div class="actions" id="mistakeActions"></div><div class="print-gate">成绩单尚未开放，请完成正式任务和必修错题。</div>';if(!list.length)$('mistakeList').textContent='尚无错题。';list.forEach(function(x){var card=document.createElement('div');card.className='mistake '+(x.r.practicedAt===null?'pending':'');var title=document.createElement('strong');title.textContent=TASKS[x.i].title;card.appendChild(title);var p=document.createElement('div');p.className='taskmeta';p.textContent=(x.r.passedAt===null?'○ 待正式通过':x.r.practicedAt===null?'● 待练':'✓ 已掌握')+' · 正式错 '+x.r.wrong+' 次 · 重练提交 '+x.r.practiceAttempts+' 次';card.appendChild(p);$('mistakeList').appendChild(card)});var b=document.createElement('button');b.type='button';b.className='primary';b.textContent='开始待练（'+pending(state).length+'）';b.disabled=!pending(state).length;b.onclick=function(){if(!pending(state).length)return;state.view='practice';practiceIndex=pending(state)[0];practiceDraft={answers:{},run:null};save();render()};$('mistakeActions').appendChild(b);var back=document.createElement('button');back.type='button';back.textContent=state.endedAt!==null?'返回通关页':'继续正式任务';back.onclick=function(){state.view=state.endedAt!==null?'report':'task';state.cursor=firstOpen(state);save();render()};$('mistakeActions').appendChild(back)}
function renderPractice(){var open=pending(state);if(!open.length){state.view=state.endedAt!==null?'report':'mistakes';save();return render()}if(practiceIndex===null||open.indexOf(practiceIndex)<0){practiceIndex=open[0];practiceDraft={answers:{},run:null}}var t=TASKS[practiceIndex];drawTask(t,practiceDraft.answers,practiceDraft.run,false,true,practiceIndex)}
function renderReport(){if(state.endedAt===null||!complete(state)){state.view='mistakes';return render()}var el=$('content'),id=state.identity;var rows=STAGES.map(function(s,i){var rs=s.tasks.map(function(t){return state.records[BY_ID[t.id]]});return '<tr><td>'+(i+1)+'. '+escapeHtml(s.title)+'</td><td>'+rs.map(function(r,j){return (j+1)+':'+r.attempts}).join(' / ')+'</td><td>'+rs.reduce(function(n,r){return n+r.score},0)+'/25</td><td>'+escapeHtml(localText(rs[rs.length-1].passedAt,id.offset))+'</td></tr>'}).join('');var badges=STAGES.map(function(s){return s.badge}).join(' · '),xp=state.records.filter(function(r){return r.passedAt!==null}).length*10;el.innerHTML='<div class="report"><div class="eyebrow">通关结案 · '+VERSION+'</div><h2>卤代烃四类通关成绩单</h2><span class="pill completion-pill"><strong>四关与全部必修错题已完成</strong></span><div class="report-card"><div><b>班级 / 姓名</b><div id="who"></div><small id="number"></small></div><div><b>训练编号</b><div id="code" style="overflow-wrap:anywhere"></div><small>本机记录编号</small></div><div><b>开始时间 / 结束时间（设备本地时间）</b><div>'+escapeHtml(state.startedText)+'</div><div>'+escapeHtml(localText(state.endedAt,id.offset))+'</div></div><div><b>活动总用时 / 总分</b><div>'+Math.floor(state.elapsedMs/60000)+' 分 '+Math.floor(state.elapsedMs%60000/1000)+' 秒 · <strong class="final-score">'+totalScore(state)+' / 100 分</strong></div><small>累计页面可见且训练中的时段</small></div></div><div class="tablewrap"><table class="reporttable"><thead><tr><th>关卡</th><th>各小任务正式提交次数</th><th>得分</th><th>该关完成时间</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="hint"><b>学习产出：</b>能按卤素连接位置命名，写出明确连接关系的结构简式，排除异构体的反向重复写法，并依据沉淀记录判断卤素类别。<br><b>证据边界：</b>沉淀颜色不能独自确定完整碳链结构；真实实验须遵循教师指导。</div><p class="note">徽章：'+escapeHtml(badges)+' · XP '+xp+'；正式错误 '+state.records.reduce(function(n,r){return n+r.wrong},0)+' 次，独立重练提交 '+state.records.reduce(function(n,r){return n+r.practiceAttempts},0)+' 次。每个任务首次通过满分，后续每多一次正式提交扣2分，最低保留60%。本机成绩可被修改，不是服务器签名或正式考试凭证；计时约每2秒保存一次，异常关闭可能损失末段计时。</p><div class="hint screen-only"><b>鉴别复盘色卡：</b>AgCl 白色，AgBr 淡黄色（奶油色），AgI 黄色。沉淀颜色支持卤素类别，不能独自证明完整碳链。</div><div class="actions screen-only"><button id="print" type="button" class="primary">打印 / 保存为 PDF（A4）</button><button id="review" type="button">只读复盘</button><button id="reviewMistakes" type="button">错题档案</button></div><div class="print-only note">V2.2 · 本机课堂练习 · 第 <span class="page"></span> 页</div></div>';$('who').textContent=id.className+' · '+id.name;$('number').textContent='学号 '+id.number;$('code').textContent=id.code;$('print').onclick=function(){window.print()};$('review').onclick=function(){state.view='task';state.cursor=0;save();render()};$('reviewMistakes').onclick=function(){state.view='mistakes';save();render()}}
$('soundToggle').onclick=function(){state.sound=!state.sound;save();updateChrome()};$('volume').oninput=function(){state.volume=Number(this.value);$('volumeLabel').textContent=state.volume+'%';save()};document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){if(activeAt!==null)settle();activeAt=null;save()}else{clockRun();save()}});window.addEventListener('pagehide',function(){if(document.visibilityState==='hidden')activeAt=null;else if(activeAt!==null)settle();save()});window.addEventListener('storage',function(e){if(e.key===KEY&&e.newValue){try{if(JSON.parse(e.newValue).seq!==state.seq){conflict=true;activeAt=null;issue='另一标签页已更新进度。当前页暂停写入，请刷新。';showIssue();renderNav()}}catch(x){}}});setInterval(function(){if(!state.identity&&entryPreview)entryPreview();if(state.identity&&state.endedAt===null&&document.visibilityState==='visible')save();showClock()},2000);if(state.identity&&state.endedAt!==null)state.view='report';clockRun();render();
})();
